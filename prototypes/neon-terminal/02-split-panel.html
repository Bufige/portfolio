<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON-7 // Split Panel — Bufige</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

    :root {
      --bg: #0a0a0c;
      --cyan: #00f0ff;
      --magenta: #ff2e88;
      --green: #39ff14;
      --dim: #4a5560;
      --text: #c8e6e8;
      --panel: rgba(10, 12, 16, 0.95);
      --glow-c: 0 0 8px #00f0ff, 0 0 28px rgba(0, 240, 255, 0.3);
      --glow-m: 0 0 8px #ff2e88, 0 0 22px rgba(255, 46, 136, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 13px;
      overflow: hidden;
    }

    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.18) 0px,
        rgba(0, 0, 0, 0.18) 1px,
        transparent 1px,
        transparent 3px
      );
      animation: flicker 9s infinite;
    }

    .vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: radial-gradient(ellipse at 40% 50%, transparent 35%, rgba(0, 0, 0, 0.8) 100%);
    }

    @keyframes flicker {
      0%, 93%, 100% { opacity: 1; }
      94% { opacity: 0.88; }
      95.5% { opacity: 1; }
      96% { opacity: 0.72; }
      97% { opacity: 1; }
    }

    .hud {
      position: fixed;
      z-index: 50;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .hud-tl { top: 14px; left: 18px; color: var(--cyan); text-shadow: var(--glow-c); }
    .hud-tr { top: 14px; right: 18px; color: var(--magenta); text-shadow: var(--glow-m); text-align: right; }
    .hud .label { color: var(--dim); margin-right: 6px; text-shadow: none; }

    .layout {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(280px, 0.95fr);
      gap: 20px;
      padding: 52px 24px 28px;
      align-items: stretch;
    }

    .frame {
      border: 2px solid var(--cyan);
      box-shadow: var(--glow-c), inset 0 0 50px rgba(0, 240, 255, 0.03);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    .frame.accent {
      border-color: var(--magenta);
      box-shadow: var(--glow-m), inset 0 0 50px rgba(255, 46, 136, 0.04);
    }

    .frame::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(0, 240, 255, 0.08);
      pointer-events: none;
    }
    .frame.accent::after { border-color: rgba(255, 46, 136, 0.1); }

    .bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      background: rgba(0, 240, 255, 0.03);
      flex-shrink: 0;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--cyan);
    }
    .frame.accent .bar {
      border-bottom-color: rgba(255, 46, 136, 0.25);
      background: rgba(255, 46, 136, 0.04);
      color: var(--magenta);
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .dot.r { background: var(--magenta); box-shadow: 0 0 5px var(--magenta); }
    .dot.y { background: #ffcc00; box-shadow: 0 0 5px #ffcc00; }
    .dot.g { background: var(--green); box-shadow: 0 0 5px var(--green); }
    .bar .tag { margin-left: auto; color: var(--dim); letter-spacing: 0.08em; }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--cyan) transparent;
    }

    .line { white-space: pre-wrap; word-break: break-word; line-height: 1.55; }
    .line.boot { color: var(--green); text-shadow: 0 0 4px rgba(57, 255, 20, 0.35); }
    .line.cyan { color: var(--cyan); }
    .line.mag { color: var(--magenta); }
    .line.dim { color: var(--dim); }
    .line.err { color: #fff; animation: rgbSplit 0.35s steps(2) 3; }

    @keyframes rgbSplit {
      0% { text-shadow: 2px 0 #ff2e88, -2px 0 #00f0ff; }
      33% { text-shadow: -3px 0 #ff2e88, 3px 0 #00f0ff; transform: translateX(-2px); }
      66% { text-shadow: 3px 0 #ff2e88, -2px 0 #00f0ff; transform: translateX(2px); }
      100% { text-shadow: none; transform: none; }
    }

    .prompt-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px 12px;
      border-top: 1px solid rgba(0, 240, 255, 0.15);
      flex-shrink: 0;
    }
    .prompt-label { color: var(--magenta); white-space: nowrap; }
    .prompt-label .u { color: var(--cyan); }
    #cmd {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font: inherit;
      caret-color: var(--cyan);
    }

    /* Right panel — project preview */
    .preview {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }

    .preview.empty {
      align-items: center;
      justify-content: center;
      color: var(--dim);
      text-align: center;
      gap: 10px;
    }
    .preview.empty .big {
      font-size: 28px;
      color: rgba(0, 240, 255, 0.15);
      letter-spacing: 0.3em;
    }

    .pv-id {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--magenta);
      text-shadow: var(--glow-m);
    }

    .pv-name {
      font-size: 22px;
      color: var(--cyan);
      text-shadow: var(--glow-c);
      letter-spacing: 0.06em;
    }

    .pv-desc {
      color: var(--text);
      line-height: 1.65;
      opacity: 0.9;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: var(--cyan);
      padding: 3px 10px;
      font-size: 11px;
      letter-spacing: 0.06em;
    }
    .chip.m {
      border-color: rgba(255, 46, 136, 0.45);
      color: var(--magenta);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
      padding-top: 14px;
      border-top: 1px dashed rgba(0, 240, 255, 0.2);
    }
    .links a {
      color: var(--green);
      text-decoration: none;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.4);
    }
    .links a:hover { color: var(--cyan); }
    .links .na { color: var(--dim); }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
    }
    .file-item {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      padding: 6px 8px;
      cursor: pointer;
      border: 1px solid transparent;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
    }
    .file-item:hover, .file-item.active {
      border-color: rgba(0, 240, 255, 0.35);
      background: rgba(0, 240, 255, 0.06);
      color: var(--cyan);
    }
    .file-item .idx { color: var(--magenta); }

    .proto-tag {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--dim);
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 12px;
        padding: 48px 12px 36px;
      }
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="hud hud-tl"><span class="label">NODE</span>SIG / NEON-7</div>
  <div class="hud hud-tr"><span class="label">UPTIME</span><span id="uptime">00:00:00</span></div>
  <div class="proto-tag">PROTOTYPE 02 · SPLIT PANEL</div>

  <div class="layout">
    <!-- Terminal -->
    <section class="frame">
      <div class="bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span>shell · nsh</span>
        <span class="tag" id="conn">BOOT</span>
      </div>
      <div class="screen" id="screen"></div>
      <div class="prompt-row" id="promptRow" style="visibility:hidden">
        <span class="prompt-label"><span class="u">guest</span>@neon-7:~$</span>
        <input id="cmd" autocomplete="off" spellcheck="false" />
      </div>
    </section>

    <!-- Live preview -->
    <section class="frame accent">
      <div class="bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span>preview · buffer</span>
        <span class="tag">READ-ONLY</span>
      </div>
      <div class="preview empty" id="preview">
        <div class="big">IDLE</div>
        <div>run <span style="color:var(--cyan)">files</span> then <span style="color:var(--magenta)">open &lt;id&gt;</span></div>
        <div style="font-size:11px;margin-top:8px">or click a file after listing</div>
      </div>
    </section>
  </div>

  <script>
    const PROJECTS = [
      { id: 0, name: 'Portfolio', desc: 'Portfolio to showcase skills and projects.', tech: ['react', 'styled-components', 'vite'], skills: ['front-end', 'responsive'], demo: 'https://bufige-portfolio.vercel.app', github: 'https://github.com/bufige' },
      { id: 1, name: 'Buvie', desc: 'A movie app to search for movies and its details.', tech: ['react', 'api', 'styled-components'], skills: ['front-end', 'responsive'], demo: 'https://buvie.vercel.app', github: 'https://github.com/bufige/buvie' },
      { id: 2, name: 'Twitch App', desc: 'A copycat app of twitch using react native.', tech: ['react-native'], skills: ['front-end', 'mobile'], demo: '', github: 'https://github.com/outbreakx/twitch-app' },
      { id: 3, name: 'Ecommerce FE', desc: 'A frontend with basic ecommerce features and design.', tech: ['react', 'styled-components'], skills: ['front-end', 'mobile first'], demo: 'https://bufige-ecommerce.vercel.app', github: 'https://github.com/Bufige/ecommerce-react' },
      { id: 4, name: 'Ecommerce API', desc: 'API with basic ecommerce features.', tech: ['nodejs', 'adonisjs'], skills: ['back-end', 'api'], demo: 'https://bufige-ecommerce-api.herokuapp.com/products', github: 'https://github.com/Bufige/ecommerce-api' },
      { id: 5, name: 'Webchat Svelte', desc: 'Basic webchat with svelte + sockets.', tech: ['svelte', 'socket.io', 'mongodb'], skills: ['front-end', 'sockets'], demo: 'https://chat-svelte-frontend.vercel.app', github: 'https://github.com/Bufige/chat-svelte-frontend' },
      { id: 6, name: 'Nubank UI', desc: 'Implementation of the Nubank homepage.', tech: ['react-native'], skills: ['front-end', 'mobile'], demo: '', github: 'https://github.com/Bufige/nubank-interface.git' },
    ];

    const BOOT = [
      { t: '> NEON-7 dual-buffer init', c: 'cyan' },
      { t: '[ OK ] allocate tty0 .............. shell', c: 'boot' },
      { t: '[ OK ] allocate tty1 .............. preview', c: 'boot' },
      { t: '[ OK ] link buffers ............... bidirectional', c: 'boot' },
      { t: '[ OK ] crt phosphor ............... warm', c: 'boot' },
      { t: '[ OK ] scanline mesh .............. engaged', c: 'boot' },
      { t: '[ OK ] load identity .............. BUFIGE', c: 'boot' },
      { t: '[ OK ] index projects ............. 7', c: 'boot' },
      { t: '[ OK ] mount github ............... ok', c: 'boot' },
      { t: '[ OK ] demo probes ................ deferred', c: 'boot' },
      { t: '[ OK ] input focus ................ shell', c: 'boot' },
      { t: '[WARN] preview idle until open', c: 'mag' },
      { t: '[ OK ] nsh ready', c: 'boot' },
      { t: '', c: 'dim' },
      { t: 'split-panel mode · type help', c: 'dim' },
      { t: '', c: 'dim' },
    ];

    const screen = document.getElementById('screen');
    const preview = document.getElementById('preview');
    const cmd = document.getElementById('cmd');
    const promptRow = document.getElementById('promptRow');
    const conn = document.getElementById('conn');
    const uptimeEl = document.getElementById('uptime');
    const t0 = Date.now();
    let listed = false;

    function pad(n) { return String(n).padStart(2, '0'); }
    setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      uptimeEl.textContent = `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`;
    }, 1000);

    function addLine(text, cls = '') {
      const p = document.createElement('p');
      p.className = 'line ' + cls;
      p.textContent = text;
      screen.appendChild(p);
      screen.scrollTop = screen.scrollHeight;
    }

    function showProject(p) {
      preview.className = 'preview';
      preview.innerHTML = `
        <div class="pv-id">PROJECT_${String(p.id).padStart(2,'0')}</div>
        <div class="pv-name">${p.name}</div>
        <div class="pv-desc">${p.desc}</div>
        <div class="chips">${p.tech.map(t => `<span class="chip">${t}</span>`).join('')}</div>
        <div class="chips">${p.skills.map(s => `<span class="chip m">${s}</span>`).join('')}</div>
        <div class="links">
          ${p.demo ? `<a href="${p.demo}" target="_blank" rel="noopener">→ demo  ${p.demo}</a>` : `<span class="na">→ demo  (offline)</span>`}
          <a href="${p.github}" target="_blank" rel="noopener">→ git   ${p.github}</a>
        </div>
      `;
      document.querySelectorAll('.file-item').forEach(el => {
        el.classList.toggle('active', Number(el.dataset.id) === p.id);
      });
    }

    function printFiles() {
      listed = true;
      addLine('projects/', 'cyan');
      PROJECTS.forEach(p => addLine(`  ${String(p.id).padStart(2,'0')}  ${p.name}`, 'boot'));
      addLine('click right panel list or: open <id>', 'dim');

      // also paint clickable list into preview if idle-ish
      preview.className = 'preview';
      preview.innerHTML = `
        <div class="pv-id">DIRECTORY</div>
        <div class="pv-name" style="font-size:16px">/projects</div>
        <div class="file-list" id="flist">
          ${PROJECTS.map(p => `
            <div class="file-item" data-id="${p.id}">
              <span class="idx">${String(p.id).padStart(2,'0')}</span>
              <span>${p.name}</span>
            </div>
          `).join('')}
        </div>
      `;
      preview.querySelectorAll('.file-item').forEach(el => {
        el.addEventListener('click', () => {
          const p = PROJECTS.find(x => x.id === Number(el.dataset.id));
          if (p) {
            addLine(`guest@neon-7:~$ open ${p.id}`, 'dim');
            showProject(p);
          }
        });
      });
    }

    function handle(raw) {
      const input = raw.trim();
      if (!input) return;
      addLine(`guest@neon-7:~$ ${input}`, 'dim');
      const [op, ...rest] = input.split(/\s+/);
      const arg = rest.join(' ');
      const c = op.toLowerCase();

      if (c === 'help') {
        addLine('help | files | open <id> | neon | clear | whoami', 'cyan');
        addLine('right panel mirrors open / files', 'dim');
      } else if (c === 'files' || c === 'ls') {
        printFiles();
      } else if (c === 'open' || c === 'cat') {
        const q = (arg || '').toLowerCase();
        const p = PROJECTS.find(x => String(x.id) === q || x.name.toLowerCase().includes(q));
        if (!p) addLine(`nsh: no project '${arg}'`, 'err');
        else {
          addLine(`loaded ${p.name} → preview`, 'boot');
          showProject(p);
        }
      } else if (c === 'neon') {
        addLine('palette  #0a0a0c  #00f0ff  #ff2e88', 'mag');
        addLine('mode     split · shell + live buffer', 'cyan');
      } else if (c === 'whoami') {
        addLine('Bufige · FullStack Developer', 'cyan');
      } else if (c === 'clear') {
        screen.innerHTML = '';
      } else {
        addLine(`nsh: command not found: ${op}`, 'err');
      }
    }

    async function boot() {
      for (const line of BOOT) {
        addLine(line.t, line.c);
        await new Promise(r => setTimeout(r, 40 + Math.random() * 40));
      }
      conn.textContent = 'ONLINE';
      conn.style.color = 'var(--green)';
      promptRow.style.visibility = 'visible';
      cmd.focus();
    }

    cmd.addEventListener('keydown', e => {
      if (e.key === 'Enter') { handle(cmd.value); cmd.value = ''; }
    });
    document.querySelector('.frame:not(.accent)').addEventListener('click', () => cmd.focus());
    boot();
  </script>
</body>
</html>
